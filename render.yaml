# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: pursecast
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Database migrations run on every deploy, before the new version starts.
    buildCommand: npm ci && npx prisma db migrate && npm run build
    startCommand: npm start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Pursecast <hello@pursecast.com>
      - key: NATIONAL_INFLATION
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: where server errors are reported (a Slack/Discord webhook
      # and/or an email address; email needs the RESEND_* keys).
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_EMAIL
        sync: false
      # Claude calls per person per day for reading screenshots and PDFs.
      - key: STATEMENT_AI_DAILY_LIMIT
        value: "20"
      # Push notifications (web push). Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@pursecast.com
      # Shared with the reminders job below.
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        value: https://pursecast.onrender.com

      # Bank connections (Enable Banking). Add the private key as a Secret File
      # named enablebanking.pem (Environment > Secret Files).
      - key: ENABLE_BANKING_APP_ID
        sync: false

  # Every hour: push reminders (from 8:00 in each person's time zone) and the
  # Monday email. Set CRON_SECRET to the same value as on the web service.
  - type: cron
    name: pursecast-reminders
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "5 * * * *"
    buildCommand: "true"
    startCommand: node -e "fetch(process.env.APP_URL + '/api/cron/reminders', { headers: { authorization: 'Bearer ' + process.env.CRON_SECRET } }).then(async (r) => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1); })"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://pursecast.onrender.com
      - key: CRON_SECRET
        sync: false
