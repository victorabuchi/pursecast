# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: pursecast
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Database migrations run on every deploy, before the new version starts.
    buildCommand: npm ci && npx prisma db migrate && npm run build
    startCommand: npm start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Pursecast <hello@pursecast.com>
      - key: NATIONAL_INFLATION
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: where server errors are reported (a Slack/Discord webhook
      # and/or an email address; email needs the RESEND_* keys).
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_EMAIL
        sync: false
      # Claude calls per person per day for reading screenshots and PDFs.
      - key: STATEMENT_AI_DAILY_LIMIT
        value: "20"
      # Push notifications (web push). Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@pursecast.com
      # Shared with the reminders job below.
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        value: https://pursecast.com

      # Bank connections (Enable Banking). Add the private key as a Secret File
      # named enablebanking.pem (Environment > Secret Files).
      - key: ENABLE_BANKING_APP_ID
        sync: false
      # Sign in with Google (Google Cloud > APIs & Services > Credentials).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Sign in with Apple (developer.apple.com): Services ID, Team ID, Key ID and the .p8 key text.
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false

# The hourly job (reminders at 8:00 local time, the Monday email, bank
# updates every 6 hours) runs from the Supabase database with pg_cron:
#   select cron.schedule('pursecast-reminders', '5 * * * *',
#     $$select net.http_get(url := 'https://pursecast.com/api/cron/reminders',
#       headers := jsonb_build_object('Authorization', 'Bearer <CRON_SECRET>'),
#       timeout_milliseconds := 280000)$$);
# Stop it with: select cron.unschedule('pursecast-reminders');
